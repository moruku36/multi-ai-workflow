name: Automatic dual review

# Trusted main controller only. NEVER switch this to checking out the PR head.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

# Serialize reservations, including reruns. Do not cancel a potentially billed call.
concurrency:
  group: automatic-dual-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require explicit activation
        env:
          ENABLED: ${{ vars.DUAL_REVIEW_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Set MIMO_API_KEY in Actions secrets, then DUAL_REVIEW_ENABLED=true after reviewing budgets."
            exit 1
          fi
      - name: Check out trusted base controller, never PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download and verify pinned Alibaba CLI
        env:
          OCR_BINARY: ${{ runner.temp }}/opencodereview
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 --output "$OCR_BINARY" https://github.com/alibaba/open-code-review/releases/download/v1.13.7/opencodereview-linux-amd64
          echo "8c1ff786161b6dc0e8dcb06107f18bda8b6181b39ce573400add4a39f90cf19d  $OCR_BINARY" | sha256sum --check
          chmod 500 "$OCR_BINARY"
      - name: Run both real-diff review lanes
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OCR_BINARY: ${{ runner.temp }}/opencodereview
        run: python3 tools/automatic_dual_review.py
      - name: Retain source-only review receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dual-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dual-review-results/receipt.json
          if-no-files-found: warn
          retention-days: 7
