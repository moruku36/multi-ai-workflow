name: One-shot offline acceptance

# One bounded PR-only invocation; no push/main duplicate and no paid review.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  five-offline-cases:
    if: ${{ github.repository == 'moruku36/multi-ai-workflow' && github.head_ref == 'feat/central-authenticated-one-shot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run exactly five offline cases once
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B tests/check_one_shot_integration.py
