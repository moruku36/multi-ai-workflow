name: Sidekick HOLD advisory transport

# Operator runbook
# Stage the release on an inert branch and obtain independent approval of its
# full 40-hex commit SHA. The pinned issuer requests only Sidekick checks:write.
# Validate its installation/slug and the actual token's singleton repository
# listing before the write; read the App, head and HOLD back from GitHub.
# The separate installation-wide settings audit is not a token-scope receipt.
# Create the exact lightweight tag below at the approved SHA once. Never
# force, move, delete or recreate it. On an uncertain write, reconcile in GitHub.
on:
  push:
    tags: [sidekick-hold-26-20261121]

concurrency:
  group: sidekick-advisory-transport-v1
  cancel-in-progress: false

jobs:
  witness:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'moruku36/multi-ai-workflow' &&
      github.repository_id == '1365934149' &&
      github.event.repository.default_branch == 'main' &&
      github.event.repository.owner.id == 12478466 &&
      github.actor_id == '12478466' &&
      github.ref == 'refs/tags/sidekick-hold-26-20261121' &&
      github.event.ref == github.ref &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha &&
      github.run_attempt == '1'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out the tagged Hub revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moruku36/multi-ai-workflow
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify public release and target before minting
        id: preflight
        env:
          CONFIGURED_APP_ID: ${{ vars.APP_ID }}
        run: python3 -I -S -B tools/sidekick_advisory_transport.py preflight
      - name: Mint Sidekick-only installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: '5715914'
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moruku36
          repositories: local-ai-sidekick
          permission-checks: write
      - name: Verify and publish one neutral HOLD check
        env:
          SIDEKICK_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SIDEKICK_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          SIDEKICK_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CLASSIC_PROTECTION_SHA256: ${{ steps.preflight.outputs.classic-protection-sha256 }}
        run: python3 -I -S -B tools/sidekick_advisory_transport.py
